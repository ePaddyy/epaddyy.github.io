name: CI

# Quality gates on every pull request (and on main, so the badge stays honest).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  links:
    name: Broken-link check
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: lycheeverse/lychee-action@v2
        with:
          # Check every link in the built site; internal links resolve against dist/.
          args: >-
            --root-dir ${{ github.workspace }}/dist
            --exclude-path dist/og
            --accept 200,204,429
            --max-retries 3
            --no-progress
            'dist/**/*.html'
          fail: true

  lighthouse:
    name: Lighthouse budget
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npx --yes @lhci/cli@0.15.x autorun
